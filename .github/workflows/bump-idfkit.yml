name: bump-idfkit

# Adopt a published idfkit level, as a pull request (feature 004 of the unification, US4).
#
# idfkit's notify-downstream.yml dispatches this in wave 2, after the consumers that resolve idfkit
# directly, because the plugin reaches idfkit only through the two servers it hands to an editor.
# It never pins idfkit. It pins idfkit-mcp in .mcp.json and idfkit-lsp in .lsp.json, and idfkit
# follows from those releases.
#
# ORDER IS ENFORCED HERE, NOT ASSUMED (FR-020). idfkit-conformance's tools/adoption.py check-order
# rejects the adoption until each server the plugin pins has a release on the new level, naming the
# server it waits on. For idfkit-mcp that is a hard stop: this run fails red, and the adoption
# follows once idfkit-mcp releases.
#
# THE LANGUAGE SERVER DOES NOT STOP THE RUN. idfkit-lsp is published to PyPI since 0.2.0
# (idfkit/idfkit-plugin#17), and .lsp.json moves to its newest release on the level in the same pull
# request as .mcp.json. When idfkit-lsp has no release on the level yet, the MCP half proceeds alone
# and the pull request says that .lsp.json is unchanged. The plugin's EnergyPlus delivery-pins step
# checks both pins, so a pull request that moves only one leaves that step waiting until the other
# is moved by hand.
#
# A SERVER'S RELEASE OFFERS THE LEVEL TOO. idfkit-mcp's and idfkit-lsp's notify-dependents.yml
# dispatch this after each release, with `offered_by` naming that release (`idfkit-lsp 0.5.1`). The
# level is often one the plugin already runs through the other server, so the pull request's title
# and body are built from the pins this run actually moves, never from a fixed server: an offer
# from idfkit-lsp that moves only .lsp.json is titled for idfkit-lsp. A run that moves no pin opens
# no pull request.
#
# DECLINING. Give `decline_reason` and nothing is bumped: the run records a deliberate lag in the
# consumer register instead (FR-024). The reason states a policy, never a version.

on:
  workflow_dispatch:
    inputs:
      idfkit_version:
        description: The released idfkit version to adopt, with or without a leading v.
        required: true
        type: string
      decline_reason:
        description: Decline the level instead, recording this policy as a deliberate lag.
        required: false
        type: string
        default: ""
      offered_by:
        description: The server release that offered this level, as `<package> <version>`. Empty when idfkit's own release dispatches it.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-idfkit
  cancel-in-progress: false

env:
  CONSUMER: idfkit-plugin
  GOVERNANCE_LEVEL: governance-2026.18

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check out the consumer register
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: refs/tags/${{ env.GOVERNANCE_LEVEL }}
          path: governance
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.idfkit_version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The consumer register lives in idfkit-conformance, so recording an adoption there is a dispatch
      # into another repository. The organisation's GitHub App (idfkit-bot) mints a token for that one
      # repository, valid for an hour, rather than a personal token stored for months. Without APP_ID
      # and APP_PRIVATE_KEY this step is skipped and the steps below say what to run instead.
      - name: Mint a token that can dispatch in idfkit-conformance
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idfkit-conformance
      - name: Decline, and record why
        if: inputs.decline_reason != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ inputs.decline_reason }}
        run: |
          set -euo pipefail
          command=(gh workflow run record-adoption.yml -R idfkit/idfkit-conformance
                   -f consumer="$CONSUMER" -f library=python -f outcome=decline -f reason="$REASON")
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Decline not recorded::No APP_ID/APP_PRIVATE_KEY, so the deliberate lag cannot be recorded from here. Run: ${command[*]}"
            exit 1
          fi
          "${command[@]}"

      # check-order names every provider that has not released on this level. idfkit-mcp is a
      # hard stop; idfkit-lsp is reported and recorded, for the reason in the header.
      - name: Refuse to adopt before idfkit-mcp has
        id: order
        if: inputs.decline_reason == ''
        run: |
          set +e
          python governance/tools/adoption.py check-order --consumer "$CONSUMER" --library python \
            --level "${{ steps.ver.outputs.version }}" 2> "$RUNNER_TEMP/order.txt"
          cat "$RUNNER_TEMP/order.txt"
          if grep -q "provider idfkit-mcp" "$RUNNER_TEMP/order.txt"; then
            echo "::error title=Out of order::idfkit-mcp has published no release on idfkit ${{ steps.ver.outputs.version }}. The plugin adopts after it (FR-020)."
            exit 1
          fi
          if grep -q "provider idfkit-lsp" "$RUNNER_TEMP/order.txt"; then
            echo "lsp_waiting=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=LSP unchanged::idfkit-lsp has no release on this level, so .lsp.json does not move."
          fi

      - name: Find the server releases on this level
        id: release
        if: inputs.decline_reason == ''
        env:
          LEVEL: ${{ steps.ver.outputs.version }}
          LSP_WAITING: ${{ steps.order.outputs.lsp_waiting }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          sys.path.insert(0, "governance/tools")
          from adoption import _fetch_json, pypi_released_on
          released_on = pypi_released_on(_fetch_json)
          release = released_on("idfkit-mcp", os.environ["LEVEL"])
          if release is None:
              sys.exit("check-order allowed the adoption, and no idfkit-mcp release pins this level. Stop.")
          print(f"release={release}")
          if os.environ.get("LSP_WAITING") != "true":
              lsp = released_on("idfkit-lsp", os.environ["LEVEL"])
              if lsp is None:
                  sys.exit("check-order allowed the adoption, and no idfkit-lsp release pins this level. Stop.")
              print(f"lsp_release={lsp}")
          PY

      # Text substitution rather than a JSON round trip, so the file keeps its formatting and the
      # diff is the one version string that changed.
      - name: Pin the MCP server to that release
        if: inputs.decline_reason == ''
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path(".mcp.json")
          text, count = re.subn(r'"idfkit-mcp(@[^"]*)?"', f'"idfkit-mcp@{os.environ["RELEASE"]}"', path.read_text())
          if count != 1:
              raise SystemExit(f"expected one idfkit-mcp entry in .mcp.json, found {count}")
          path.write_text(text)
          PY

      # The same substitution for the language server, whose pin is the `--from` argument.
      - name: Pin the language server to that release
        if: inputs.decline_reason == '' && steps.release.outputs.lsp_release != ''
        env:
          RELEASE: ${{ steps.release.outputs.lsp_release }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path(".lsp.json")
          text, count = re.subn(r'"idfkit-lsp(==[^"]*)?"', f'"idfkit-lsp=={os.environ["RELEASE"]}"', path.read_text())
          if count != 1:
              raise SystemExit(f"expected one idfkit-lsp entry in .lsp.json, found {count}")
          path.write_text(text)
          PY

      - name: Run the tests
        id: tests
        if: inputs.decline_reason == ''
        continue-on-error: true
        run: python -m unittest tests.discovery.test_discover -v

      # The title and body name the servers whose pins moved, read from the files against the base
      # commit, so an offer that finds .mcp.json already on the level does not claim to move it.
      - name: Describe the pins that moved
        id: describe
        if: inputs.decline_reason == ''
        env:
          LEVEL: ${{ steps.ver.outputs.version }}
          OFFERED_BY: ${{ inputs.offered_by }}
          TESTS: ${{ steps.tests.outcome }}
          LSP_WAITING: ${{ steps.order.outputs.lsp_waiting }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from dataclasses import dataclass
          from pathlib import Path

          @dataclass(frozen=True)
          class Pin:
              package: str
              path: str
              pattern: str

              def read(self, text: str) -> str:
                  match = re.search(self.pattern, text)
                  if match is None:
                      raise SystemExit(f"no {self.package} pin in {self.path}")
                  return match.group(1)

              def before(self) -> str:
                  return self.read(subprocess.run(["git", "show", f"HEAD:{self.path}"], check=True,
                                                  capture_output=True, text=True).stdout)

              def after(self) -> str:
                  return self.read(Path(self.path).read_text())

          pins = [Pin("idfkit-mcp", ".mcp.json", r'"idfkit-mcp@([^"]+)"'),
                  Pin("idfkit-lsp", ".lsp.json", r'"idfkit-lsp==([^"]+)"')]
          level, offered_by = os.environ["LEVEL"], os.environ["OFFERED_BY"].strip()
          moved = [(p, p.before(), p.after()) for p in pins if p.before() != p.after()]

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not moved:
              print(f"::notice title=Nothing to deliver::Both servers are already pinned to their releases on idfkit {level}.")
              out.write("moved=false\n")
              raise SystemExit(0)

          title = "Deliver " + " and ".join(f"{p.package} {new}" for p, _, new in moved) + f" (idfkit {level})"
          lines = [f"{offered_by} was released on idfkit {level}." if offered_by else f"idfkit {level} was released.",
                   "This moves the plugin's servers onto that level:", ""]
          for p in pins:
              old, new = p.before(), p.after()
              if old != new:
                  lines.append(f"- `{p.path}`: moves {p.package} from {old} to {new}, its newest release on this level.")
              elif p.package == "idfkit-lsp" and os.environ.get("LSP_WAITING") == "true":
                  lines.append(f"- `{p.path}`: {p.package} unchanged at {old}. idfkit-lsp has no release on this level yet; "
                               "move it by hand once it has one. The EnergyPlus delivery-pins step waits on both pins.")
              else:
                  lines.append(f"- `{p.path}`: {p.package} unchanged at {old}, already on this level.")
          lines += ["", "Every user who installs or updates the plugin after this merges runs the moved "
                    + ("server." if len(moved) == 1 else "servers."), "",
                    f"- Discovery tests: `{os.environ['TESTS']}`", "",
                    ("Offered by " + offered_by.split()[0] + "'s notify-dependents.yml" if offered_by
                     else "Opened by idfkit's notify-downstream.yml") + "; it never merges itself."]
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text("\n".join(lines) + "\n")
          out.write(f"moved=true\ntitle={title}\n")
          PY

      - name: Open the pull request
        if: inputs.decline_reason == '' && steps.describe.outputs.moved == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/bump-idfkit-${{ steps.ver.outputs.version }}
          # Only what this workflow writes. Every other checkout (the register under governance/) lives in
          # the same tree, and without this list it is committed as a gitlink.
          add-paths: |
            .mcp.json
            .lsp.json
          title: ${{ steps.describe.outputs.title }}
          commit-message: ${{ steps.describe.outputs.title }}
          reviewers: samuelduchesne
          body-path: ${{ runner.temp }}/pr-body.md
